spring.application.name=projeto
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================================================================
# CONFIGURAÇÕES DO JPA / HIBERNATE
# =====================================================================
# Define a estratégia de criação/atualização das tabelas no banco de dados
# Opções comuns: update (atualiza), create-drop (recria a cada execução), validate (apenas valida)
spring.jpa.hibernate.ddl-auto=update

# Exibe as consultas SQL geradas pelo Hibernate no console (bom para desenvolvimento)
spring.jpa.show-sql=true

# Formata o SQL exibido no console para torná-lo legível
spring.jpa.properties.hibernate.format_sql=true

