spring.application.name=api2

# ===================================================================
# DATASOURCE CONFIGURATION
# ===================================================================
# Replace 'localhost:3306' with your host and 'your_database_name' with your DB schema
spring.datasource.url=jdbc:mysql://localhost:3306/api2
spring.datasource.username=root
spring.datasource.password=
# Modern Spring Boot automatically detects the driver, but it's safe to define explicitly:
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE CONFIGURATION
# ===================================================================
# Options: update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Optional: Shows SQL queries in the console (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Specifies the MySQL dialect (Hibernate handles this automatically in newer versions, but useful if troubleshooting)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

