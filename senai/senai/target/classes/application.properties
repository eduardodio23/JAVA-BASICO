spring.application.name=senai

# Connection URL (Replace 'my_database' with your actual database name)
spring.datasource.url=jdbc:mysql://localhost:3306/senai?useSSL=false&serverTimezone=UTC

# Database Credentials
spring.datasource.username=root
spring.datasource.password=

# JPA / Hibernate Configurations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# 'update' automatically updates the schema structures according to your Java classes
spring.jpa.hibernate.ddl-auto=update
# Logs SQL statements to the console (useful for debugging)
spring.jpa.show-sql=true